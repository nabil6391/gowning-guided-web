<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleanroom Gowning: Dress Your Colleague</title>
<style>
  :root{--bg:#12171f;--card:#1b222d;--line:#2c3646;--text:#e8edf3;--muted:#93a1b5;--accent:#4aa3ff;--ok:#3ecf8e;--bad:#ff6b5e;--warn:#f5b942}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#20252d;color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;overflow:hidden}
  #app{display:flex;height:100%}
  #side{width:min(420px,100%);flex-shrink:0;background:var(--bg);border-right:1px solid var(--line);overflow-y:auto;padding:22px 22px 28px}
  #stage{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  #tip{position:absolute;pointer-events:none;background:rgba(18,23,31,.85);color:var(--text);font-weight:600;font-size:12px;padding:3px 9px;border-radius:6px;transform:translate(-50%,-130%);display:none;white-space:nowrap}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
  h1{font-size:24px;margin-bottom:6px} h2{font-size:20px;margin-bottom:10px;line-height:1.25} .title{font-size:17px;font-weight:700;margin-bottom:8px}
  .muted{color:var(--muted)} .small{font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:12px}
  .card.sel{border-color:var(--accent);background:rgba(74,163,255,.12)}
  .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
  .lbl.warn{color:var(--warn)}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;margin:0 6px 6px 0;background:rgba(147,161,181,.15);color:var(--muted)}
  .chip.ok{background:rgba(62,207,142,.14);color:var(--ok)} .chip.bad{background:rgba(255,107,94,.14);color:var(--bad)}
  input{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:16px;margin-bottom:18px}
  button{width:100%;text-align:left;font:inherit;font-weight:700;font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
  button:hover:not(:disabled){background:#26303f} button.primary{background:var(--accent);border-color:var(--accent);color:#08121f;text-align:center} button.primary:hover:not(:disabled){background:#7bbcff}
  button:disabled{opacity:.45;cursor:default}
  .banner{border:1px solid;border-radius:10px;padding:13px 14px;margin-bottom:12px}
  .banner.ok{border-color:var(--ok);background:rgba(62,207,142,.13)} .banner.bad{border-color:var(--bad);background:rgba(255,107,94,.13)}
  .banner b{display:block;font-size:11px;letter-spacing:.08em;margin-bottom:4px}
  .big{font-size:26px;font-weight:800;margin-bottom:4px;letter-spacing:.04em}
  .stepper{display:flex;align-items:center;margin:0 0 18px}
  .dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .dot.done{background:var(--ok);border-color:var(--ok);color:#08121f} .dot.cur{background:var(--accent);border-color:var(--accent);color:#08121f}
  .bar{flex:1;height:2px;background:var(--line)} .bar.done{background:var(--ok)}
  .term b{color:var(--accent);display:block;font-size:13px;margin-bottom:2px} .term{margin-bottom:10px;font-size:13px}
  @media(max-width:760px){#app{flex-direction:column-reverse}#side{width:100%;height:55%;border-right:0;border-top:1px solid var(--line)}#stage{height:45%;flex:none}}
</style>
  <script type="module" crossorigin src="./assets/index-PMO1jaok.js"></script>
</head>
<body>
<div id="app"><div id="side"></div><div id="stage"><canvas id="c"></canvas><div id="tip"></div></div></div>
</body>
</html>
